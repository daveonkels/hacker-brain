name: hacker-brain-model
services:
  embeddings:
    image: ${OLLAMA_IMAGE:?Set a verified Ollama image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${OLLAMA_MODEL_DIR:?Set the existing model directory}:/models:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1100m
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
